version: "3.8"

services:
  # ── Grid Bot ──
  grid:
    build: .
    container_name: hibachi-grid
    restart: unless-stopped
    env_file: .env
    environment:
      - DASHBOARD_PORT=8081
    command: ["--strategy", "grid", "--dashboard", "8081"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./hibachi-bot-grid.log:/app/hibachi-bot.log

  # ── Market Maker Bot ──
  mm:
    build: .
    container_name: hibachi-mm
    restart: unless-stopped
    env_file: .env
    environment:
      - DASHBOARD_PORT=8082
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
    command: ["--strategy", "mm", "--dashboard", "8082"]
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./hibachi-bot-mm.log:/app/hibachi-bot.log

  # ── Combined (grid + mm) ──
  combined:
    build: .
    container_name: hibachi-combined
    restart: unless-stopped
    env_file: .env
    profiles: ["combined"]
    environment:
      - DASHBOARD_PORT=8080
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
      - BINANCE_ORACLE_ENABLED=${BINANCE_ORACLE_ENABLED:-0}
    command: ["--strategy", "grid,mm", "--dashboard", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./hibachi-bot-combined.log:/app/hibachi-bot.log
