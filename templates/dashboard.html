<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <title>Hibachi Bot — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #111118;
            --border: #1e1e2e;
            --green: #00c853;
            --red: #ff1744;
            --cyan: #00e5ff;
            --gold: #ffd700;
            --text: #c8c8d0;
            --dim: #666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', 'Consolas', monospace; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: var(--cyan); font-size: 18px; letter-spacing: 2px; }
        .status { padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.running { background: #00c85322; color: var(--green); border: 1px solid var(--green); }
        .status.stopped { background: #ff174422; color: var(--red); border: 1px solid var(--red); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
        .card .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .card .value { font-size: 22px; font-weight: bold; }
        .card .value.positive { color: var(--green); }
        .card .value.negative { color: var(--red); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
        .panel h2 { font-size: 13px; color: var(--gold); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: var(--dim); padding: 6px 8px; font-weight: normal; border-bottom: 1px solid var(--border); }
        td { padding: 6px 8px; border-bottom: 1px solid #0a0a0f; }
        .buy { color: var(--green); }
        .sell { color: var(--red); }
        .event { padding: 4px 0; font-size: 11px; border-bottom: 1px solid #0a0a0f; }
        .event .time { color: var(--dim); margin-right: 8px; }
        .event .tp { color: var(--green); }
        .event .sl { color: var(--red); }
        .event .fill { color: var(--cyan); }
        .chart-container { height: 200px; position: relative; }
        .refresh { font-size: 11px; color: var(--dim); text-align: right; }
        @keyframes blink { 50% { opacity: 0.4; } }
        .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 6px; animation: blink 1s infinite; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🥩 HIBACHI BOT</h1>
        <div style="display:flex;align-items:center;gap:16px;">
            <span id="symbol" style="color:var(--dim);font-size:12px;"></span>
            <span class="status" id="status">●</span>
            <span style="font-size:11px;color:var(--dim);">Uptime: <span id="uptime">--</span></span>
        </div>
    </div>

    <!-- KPI Cards -->
    <div class="grid">
        <div class="card">
            <div class="label">Balance (USDT)</div>
            <div class="value" id="balance">--</div>
        </div>
        <div class="card">
            <div class="label">Total PnL</div>
            <div class="value" id="total_pnl">--</div>
        </div>
        <div class="card">
            <div class="label">Win Rate</div>
            <div class="value" id="win_rate">--</div>
        </div>
        <div class="card">
            <div class="label">Trades</div>
            <div class="value" id="total_trades">--</div>
        </div>
        <div class="card">
            <div class="label">Mark Price</div>
            <div class="value" id="mark_price">--</div>
        </div>
        <div class="card">
            <div class="label">Active Orders</div>
            <div class="value" id="order_count">--</div>
        </div>
    </div>

    <!-- Chart -->
    <div class="panel" style="margin-bottom:12px;">
        <h2>PnL History</h2>
        <div class="chart-container"><canvas id="pnlChart"></canvas></div>
    </div>

    <!-- Tables row -->
    <div class="row">
        <div class="panel">
            <h2>Positions</h2>
            <div id="positions"><span style="color:var(--dim);font-size:12px;">No positions</span></div>
        </div>
        <div class="panel">
            <h2>Active Orders</h2>
            <div id="orders"><span style="color:var(--dim);font-size:12px;">No orders</span></div>
        </div>
    </div>

    <!-- Events log -->
    <div class="panel">
        <h2><span class="live-dot"></span> Event Log</h2>
        <div id="events" style="max-height:300px;overflow-y:auto;"></div>
    </div>

    <div class="refresh">Auto-refresh: 5s</div>

<script>
let chart;

function initChart() {
    const ctx = document.getElementById('pnlChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'PnL (USDT)', data: [], borderColor: '#00e5ff', backgroundColor: 'rgba(0,229,255,0.05)', borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.3 }] },
        options: {
            responsive: true, maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: true, ticks: { color: '#666', font: { size: 10 } }, grid: { color: '#1e1e2e' } },
                y: { display: true, ticks: { color: '#666', font: { size: 10 }, callback: v => '$'+v }, grid: { color: '#1e1e2e' } }
            },
            plugins: { legend: { display: false } }
        }
    });
}

async function fetchState() {
    try {
        const r = await fetch('/api/state');
        const s = await r.json();

        // Status
        const el = document.getElementById('status');
        el.className = 'status ' + (s.running ? 'running' : 'stopped');
        el.innerHTML = s.running ? '<span class="live-dot"></span>RUNNING' : '⏸ STOPPED';

        // Header info
        document.getElementById('symbol').textContent = s.symbol || '';
        document.getElementById('uptime').textContent = s.uptime || '--';

        // KPIs
        document.getElementById('balance').textContent = '$' + (s.balance || 0).toLocaleString();
        document.getElementById('mark_price').textContent = '$' + (s.mark_price || 0).toLocaleString();
        document.getElementById('total_trades').textContent = s.total_trades || 0;
        document.getElementById('order_count').textContent = (s.active_orders || []).length;

        const pnlEl = document.getElementById('total_pnl');
        const pnl = s.total_pnl || 0;
        pnlEl.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toLocaleString(undefined, {minimumFractionDigits:2});
        pnlEl.className = 'value ' + (pnl >= 0 ? 'positive' : 'negative');

        document.getElementById('win_rate').textContent = (s.win_rate || 0) + '%';

        // PnL Chart
        if (s.pnl_history && s.pnl_history.length > 0) {
            chart.data.labels = s.pnl_history.map(p => p.time);
            chart.data.datasets[0].data = s.pnl_history.map(p => p.pnl);
            chart.update();
        }

        // Positions table
        if (s.positions && s.positions.length > 0) {
            let html = '<table><tr><th>Symbol</th><th>Side</th><th>Size</th><th>Entry</th><th>Mark</th><th>PnL</th></tr>';
            for (const p of s.positions) {
                const sideCls = (p.side || '').toLowerCase().includes('long') ? 'buy' : 'sell';
                const pnlCls = (p.unrealizedPnl || 0) >= 0 ? 'positive' : 'negative';
                html += `<tr>
                    <td>${p.symbol || s.symbol}</td>
                    <td class="${sideCls}">${p.side || '—'}</td>
                    <td>${p.size || p.quantity || '—'}</td>
                    <td>$${(p.entryPrice || 0).toLocaleString()}</td>
                    <td>$${(p.markPrice || 0).toLocaleString()}</td>
                    <td class="${pnlCls}">$${(p.unrealizedPnl || 0).toLocaleString()}</td>
                </tr>`;
            }
            html += '</table>';
            document.getElementById('positions').innerHTML = html;
        } else {
            document.getElementById('positions').innerHTML = '<span style="color:var(--dim);font-size:12px;">No open positions</span>';
        }

        // Orders table
        if (s.active_orders && s.active_orders.length > 0) {
            let html = '<table><tr><th>ID</th><th>Side</th><th>Type</th><th>Price</th><th>Qty</th></tr>';
            for (const o of s.active_orders) {
                const sideCls = o.side === 'BUY' ? 'buy' : 'sell';
                html += `<tr>
                    <td style="color:var(--dim)">${String(o.orderId||'').slice(-6)}</td>
                    <td class="${sideCls}">${o.side}</td>
                    <td>${o.type || 'LIMIT'}</td>
                    <td>$${(o.price || 0).toLocaleString()}</td>
                    <td>${o.quantity || o.qty || '—'}</td>
                </tr>`;
            }
            html += '</table>';
            document.getElementById('orders').innerHTML = html;
        } else {
            document.getElementById('orders').innerHTML = '<span style="color:var(--dim);font-size:12px;">No active orders</span>';
        }

        // Events
        if (s.recent_events && s.recent_events.length > 0) {
            let html = '';
            for (const e of s.recent_events.reverse()) {
                let cls = '';
                if (e.type === 'TP') cls = 'tp';
                else if (e.type === 'SL') cls = 'sl';
                else if (e.type === 'FILL') cls = 'fill';
                html += `<div class="event"><span class="time">${e.time}</span><span class="${cls}">[${e.type}]</span> ${e.detail} ${e.pnl ? '<span class="'+(e.pnl>=0?'positive':'negative')+'">$'+e.pnl.toFixed(2)+'</span>' : ''}</div>`;
            }
            document.getElementById('events').innerHTML = html;
        } else {
            document.getElementById('events').innerHTML = '<span style="color:var(--dim);font-size:12px;">Waiting for events...</span>';
        }

    } catch(e) {
        console.error(e);
    }
}

initChart();
fetchState();
setInterval(fetchState, 5000);
</script>
</body>
</html>
